apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  ports:
    - port: 5432
      name: postgres
  clusterIP: None
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    tags.datadoghq.com/env: ${DD_ENV}
    tags.datadoghq.com/service: store-db
    tags.datadoghq.com/version: '15.0'
  annotations:
    tags.datadoghq.com/git.repository_url: https://github.com/Norawit2907/DataDog-Poc.git
    tags.datadoghq.com/git.commit.sha: c7634b395439fd79b3a74a69797b49d2f310067c
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        tags.datadoghq.com/env: ${DD_ENV}
        tags.datadoghq.com/service: store-db
        tags.datadoghq.com/version: '15.0'
      annotations:
        ad.datadoghq.com/postgres.logs: "[{\n  \"source\": \"postgresql\",\n  \"service\"\
          : \"store-db\",\n  \"auto_multi_line_detection\": true,\n  \"path\": \"\
          /var/log/pg_log_shared/postgresql-*.json\",\n  \"type\": \"file\"\n}]\n"
        tags.datadoghq.com/git.repository_url: https://github.com/Norawit2907/DataDog-Poc.git
        tags.datadoghq.com/git.commit.sha: c7634b395439fd79b3a74a69797b49d2f310067c
    spec:
      containers:
        - name: postgres
          image: ${REGISTRY_URL}/postgres:${SD_TAG}
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: storedog-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: storedog-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: shared-pg-logs
              mountPath: /var/log/pg_log
      volumes:
        - name: shared-pg-logs
          persistentVolumeClaim:
            claimName: shared-pg-logs
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
